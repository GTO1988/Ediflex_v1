<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "primary-fixed-dim": "#b2c5ff", "surface-container-high": "#dee8ff", "inverse-primary": "#b2c5ff", "on-error-container": "#93000a", "surface-container-low": "#f0f3ff", "on-error": "#ffffff", "tertiary-container": "#004b32", "on-primary-fixed-variant": "#1b4292", "primary-container": "#123c8c", "tertiary-fixed-dim": "#4edea3", "surface-container-highest": "#d8e3fb", "on-primary": "#ffffff", "on-background": "#111c2d", "on-tertiary-fixed": "#002113", "secondary-container": "#adc3ff", "background": "#f9f9ff", "surface-container-lowest": "#ffffff", "error": "#ba1a1a", "primary": "#002667", "on-tertiary-fixed-variant": "#005236", "on-tertiary-container": "#29c48b", "secondary-fixed": "#dae2ff", "error-container": "#ffdad6", "on-secondary-fixed": "#001947", "tertiary": "#003220", "primary-fixed": "#dae2ff", "inverse-on-surface": "#ecf1ff", "surface-container": "#e7eeff", "outline-variant": "#c4c6d3", "on-secondary-container": "#394f84", "on-tertiary": "#ffffff", "surface": "#f9f9ff", "surface-bright": "#f9f9ff", "secondary-fixed-dim": "#b1c5ff", "surface-dim": "#cfdaf2", "surface-variant": "#d8e3fb", "secondary": "#475d92", "on-primary-fixed": "#001848", "tertiary-fixed": "#6ffbbe", "outline": "#747783", "on-secondary": "#ffffff", "on-primary-container": "#8babff", "on-surface-variant": "#434651", "on-surface": "#111c2d", "on-secondary-fixed-variant": "#2f4579", "surface-tint": "#385bac", "inverse-surface": "#263143" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "margin-desktop": "32px", "sm": "8px", "xs": "4px", "lg": "24px", "gutter": "16px", "base": "4px", "md": "16px", "margin-mobile": "16px", "xl": "32px" }, "fontFamily": { "body-md": ["Inter"], "body-lg": ["Inter"], "label-md": ["Inter"], "headline-lg": ["Inter"], "headline-lg-mobile": ["Inter"], "title-md": ["Inter"], "display-lg": ["Inter"] }, "fontSize": { "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }], "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }], "title-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }] } } } };</script><style>@layer base { body { overscroll-behavior: none; } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } } ::-webkit-scrollbar { display: none; }</style></head><body class="bg-background font-body-md text-on-background min-h-screen pt-safe pb-safe"><main class="relative w-full h-full bg-surface"><div class="flex flex-col w-full min-h-full items-center justify-between bg-primary relative overflow-hidden">
<!-- Subtle Architectural Pattern Background Overlay -->
<div class="absolute inset-0 opacity-10 pointer-events-none">
<svg height="100%" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="60" id="arch-grid" patternunits="userSpaceOnUse" width="60">
<path d="M 60 0 L 0 0 0 60" fill="none" stroke="white" stroke-width="0.5"></path>
<path d="M 30 0 L 30 60 M 0 30 L 60 30" fill="none" opacity="0.5" stroke="white" stroke-width="0.2"></path>
<path d="M 0 60 L 20 40 L 40 40 L 60 20" fill="none" opacity="0.3" stroke="white" stroke-width="0.5"></path>
</pattern>
</defs>
<rect fill="url(#arch-grid)" height="100%" width="100%"></rect>
</svg>
</div>
<!-- Animated Ambient Glow -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[150%] h-[150%] pointer-events-none opacity-20">
<div class="absolute inset-0 rounded-full bg-gradient-to-tr from-primary-fixed-dim via-transparent to-transparent blur-[120px] animate-[pulse_8s_infinite]"></div>
</div>
<!-- Top Spacer to push content center -->
<div class="h-16 w-full"></div>
<!-- Central Brand Cluster -->
<div class="relative z-10 flex flex-col items-center px-margin-mobile text-center">
<!-- Logo Container with soft entrance -->
<div class="opacity-0 translate-y-4 transition-all duration-1000 ease-out mb-xl" id="logo-container">
<img alt="EDIFLEX Logo" class="w-64 md:w-80 h-auto drop-shadow-2xl" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAA24MW1w3cXI2tIk-d503e2wM6FuQxlGvpCBTAZs4HyXUac5UOfTfj9wKoROxNpbPovQPlN69kcqOdte3zpjfrnv0GmPDLlrMg7b-nOIzJCNqlulJW9DRWoKxTZDRGDAyFAtdKpFkfA3RCDs1f-0x8WdJx09gjA3Nm_kyFzWgIc6YDaY4U8WCxhtWSCfURw-5DQ0CKqkjclCjiyLL0pOIF9IxNAUrAM0XHCOZFzkl0RosWf8tDz50Z"/>
</div>
<!-- Tagline -->
<div class="opacity-0 translate-y-4 transition-all duration-1000 delay-300 ease-out" id="tagline-container">
<p class="font-display-lg text-headline-lg-mobile text-on-primary tracking-tight max-w-[280px]">
        Administración inteligente de tu comunidad
      </p>
</div>
</div>
<!-- Bottom Interactive/Loading Area -->
<div class="relative z-10 w-full px-margin-mobile pb-32 flex flex-col items-center">
<!-- Progress Indicator -->
<div class="w-48 h-1 bg-white/10 rounded-full overflow-hidden relative mb-md">
<div class="absolute top-0 left-0 h-full w-0 bg-primary-fixed-dim transition-all duration-[3000ms] ease-in-out" id="progress-bar"></div>
</div>
<!-- Status Text -->
<div class="font-label-md text-label-md text-primary-fixed-dim/60 uppercase tracking-[0.2em] opacity-0 transition-opacity duration-700 delay-500" id="status-text">
      Sincronizando edificio...
    </div>
</div>
<!-- Decorative Architectural Elements (SVG) -->
<div class="absolute bottom-0 left-0 w-full pointer-events-none">
<svg class="w-full opacity-20" fill="none" viewbox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
<path d="M0 120V80L40 60V120H0Z" fill="white"></path>
<path d="M40 120V40L100 10V120H40Z" fill="white" opacity="0.6"></path>
<path d="M100 120V50L160 30L220 50V120H100Z" fill="white" opacity="0.4"></path>
<path d="M220 120V70L280 40V120H220Z" fill="white" opacity="0.6"></path>
<path d="M280 120V90L340 75L400 90V120H280Z" fill="white"></path>
</svg>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const logo = document.getElementById('logo-container');
      const tagline = document.getElementById('tagline-container');
      const progress = document.getElementById('progress-bar');
      const status = document.getElementById('status-text');

      // Trigger entrance animations
      setTimeout(() => {
        logo.classList.remove('opacity-0', 'translate-y-4');
        logo.classList.add('opacity-100', 'translate-y-0');
      }, 200);

      setTimeout(() => {
        tagline.classList.remove('opacity-0', 'translate-y-4');
        tagline.classList.add('opacity-100', 'translate-y-0');
      }, 500);

      setTimeout(() => {
        status.classList.remove('opacity-0');
        status.classList.add('opacity-100');
        progress.style.width = '100%';
      }, 800);

      // Status text cycle for delight
      const messages = [
        "Sincronizando edificio...",
        "Optimizando recursos...",
        "Bienvenido a casa",
        "EDIFLEX"
      ];
      let i = 0;
      const interval = setInterval(() => {
        i++;
        if (i < messages.length) {
          status.style.opacity = '0';
          setTimeout(() => {
            status.textContent = messages[i];
            status.style.opacity = '1';
          }, 300);
        } else {
          clearInterval(interval);
        }
      }, 1500);
    });
  </script>
<style>
    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.15; }
      50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.25; }
    }
  </style>
</div></main></body></html>
