 { "body-md": ["Inter"], "body-lg": ["Inter"], "label-md": ["Inter"], "headline-lg": ["Inter"], "headline-lg-mobile": ["Inter"], "title-md": ["Inter"], "display-lg": ["Inter"] }, "fontSize": { "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }], "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }], "title-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }] } } } };</script><style>@layer base { body { overscroll-behavior: none; } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } } ::-webkit-scrollbar { display: none; }</style></head><body class="bg-background font-body-md text-on-background min-h-screen pt-safe pb-safe"><main class="relative w-full h-full bg-surface"><div class="flex flex-col w-full px-margin-mobile">
<!-- Brand Header -->
<div class="flex flex-col items-center justify-center pt-xl pb-lg space-y-md">
<div class="w-32 h-32 flex items-center justify-center transform transition-transform duration-700 hover:scale-105">
<img alt="Ediflex Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAA24MW1w3cXI2tIk-d503e2wM6FuQxlGvpCBTAZs4HyXUac5UOfTfj9wKoROxNpbPovQPlN69kcqOdte3zpjfrnv0GmPDLlrMg7b-nOIzJCNqlulJW9DRWoKxTZDRGDAyFAtdKpFkfA3RCDs1f-0x8WdJx09gjA3Nm_kyFzWgIc6YDaY4U8WCxhtWSCfURw-5DQ0CKqkjclCjiyLL0pOIF9IxNAUrAM0XHCOZFzkl0RosWf8tDz50Z"/>
</div>
<div class="text-center space-y-xs">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background tracking-tight">Inicia sesión</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Bienvenido a Ediflex Building Management</p>
</div>
</div>
<!-- Login Form Card -->
<div class="bg-surface-container-lowest rounded-xl p-lg shadow-sm space-y-lg relative overflow-hidden">
<!-- Subtle Decorative Background Element -->
<div class="absolute -top-12 -right-12 w-32 h-32 bg-primary-container/5 rounded-full blur-3xl"></div>
<div class="flex flex-col space-y-md relative z-10">
<!-- Email Input -->
<div class="group flex flex-col space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant px-xs transition-colors group-focus-within:text-primary" for="email">Correo electrónico</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-outline group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full pl-11 pr-md py-3 bg-surface-container-low rounded-lg font-body-md text-body-md text-on-surface outline-none focus:ring-2 focus:ring-primary/20 transition-all border-b-2 border-transparent focus:border-primary" id="email" placeholder="ejemplo@correo.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="group flex flex-col space-y-xs">
<div class="flex justify-between items-center px-xs">
<label class="font-label-md text-label-md text-on-surface-variant transition-colors group-focus-within:text-primary" for="password">Contraseña</label>
<button class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors">
            Olvidé mi contraseña
          </button>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full pl-11 pr-11 py-3 bg-surface-container-low rounded-lg font-body-md text-body-md text-on-surface outline-none focus:ring-2 focus:ring-primary/20 transition-all border-b-2 border-transparent focus:border-primary" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-md text-outline hover:text-on-surface-variant transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col space-y-md pt-md relative z-10">
<button class="w-full py-4 bg-primary text-on-primary rounded-full font-title-md text-title-md shadow-md active:scale-[0.98] transition-all flex items-center justify-center space-x-sm">
<span>Ingresar</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<div class="flex items-center space-x-md py-sm">
<div class="flex-1 h-[1px] bg-outline-variant"></div>
<span class="font-label-md text-label-md text-outline">o</span>
<div class="flex-1 h-[1px] bg-outline-variant"></div>
</div>
<button class="w-full py-3 bg-surface-container-high text-primary rounded-lg font-body-md text-body-md flex items-center justify-center space-x-sm hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined">domain_add</span>
<span>Solicitar acceso a mi edificio</span>
</button>
</div>
</div>
<!-- Footer / Help -->
<div class="mt-xl text-center space-y-md pb-xl">
<p class="font-body-md text-body-md text-on-surface-variant">
      ¿Necesitas ayuda? <a class="text-primary font-medium underline underline-offset-4" href="#">Contactar soporte</a>
</p>
<!-- Aesthetic Progress Illustration -->
<div class="flex justify-center items-center opacity-40">
<svg class="animate-spin-slow" fill="none" height="40" viewbox="0 0 40 40" width="40" xmlns="http://www.w3.org/2000/svg">
<circle class="text-primary" cx="20" cy="20" r="18" stroke="currentColor" stroke-dasharray="10 20" stroke-width="2"></circle>
<circle class="text-secondary" cx="20" cy="20" r="12" stroke="currentColor" stroke-dasharray="5 15" stroke-width="2"></circle>
</svg>
</div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('password');
      
      if (toggleBtn && passwordInput) {
        toggleBtn.addEventListener('click', () => {
          const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
          passwordInput.setAttribute('type', type);
          toggleBtn.querySelector('span').textContent = type === 'password' ? 'visibility' : 'visibility_off';
        });
      }

      // Add a subtle ripple-like effect on button click
      const primaryBtn = document.querySelector('button.bg-primary');
      primaryBtn.addEventListener('mousedown', function(e) {
        const rect = this.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        const ripple = document.createElement('span');
        ripple.style.position = 'absolute';
        ripple.style.width = '2px';
        ripple.style.height = '2px';
        ripple.style.background = 'rgba(255, 255, 255, 0.4)';
        ripple.style.borderRadius = '50%';
        ripple.style.left = x + 'px';
        ripple.style.top = y + 'px';
        ripple.style.transform = 'scale(0)';
        ripple.style.transition = 'transform 0.6s ease-out, opacity 0.6s ease-out';
        ripple.style.pointerEvents = 'none';
        
        this.style.position = 'relative';
        this.style.overflow = 'hidden';
        this.appendChild(ripple);
        
        setTimeout(() => {
          ripple.style.transform = 'scale(200)';
          ripple.style.opacity = '0';
        }, 10);
        
        setTimeout(() => {
          ripple.remove();
        }, 650);
      });
    });
  </script>
<style>
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-slow {
      animation: spin-slow 12s linear infinite;
    }
    input::placeholder {
      color: #747783;
      opacity: 0.6;
    }
  </style>
</div></main></body></html>
